name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Build
        run: make all CFLAGS="-O2 -fopenmp -Wall -Wextra -std=c17"
      - name: Smoke test OpenMP kernel
        run: ./bin/monte_carlo_pi 1000000
      - name: Smoke test hybrid MPI kernel
        run: mpirun --allow-run-as-root -np 2 ./bin/jacobi_2d 128 500 1e-4
      - name: Smoke test GBM engine
        run: ./bin/gbm_engine 100 0.08 0.25 30 10000
      - name: Smoke test MPI ping-pong
        run: mpirun --allow-run-as-root -np 2 ./bin/mpi_pingpong
      - name: Smoke test MPI collectives
        run: mpirun --allow-run-as-root -np 2 ./bin/mpi_collectives
